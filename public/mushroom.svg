<svg xmlns="http://www.w3.org/2000/svg" width="11" height="10" shape-rendering="crispEdges">
  <!-- Cap shadow/outline row 0 -->
  <rect x="3" y="0" width="5" height="1" fill="#902020"/>
  <!-- Cap rows -->
  <rect x="2" y="1" width="7" height="1" fill="#d04040"/>
  <rect x="1" y="2" width="9" height="1" fill="#d04040"/>
  <!-- Spots row 2 -->
  <rect x="3" y="2" width="1" height="1" fill="#f8eedc"/>
  <rect x="7" y="2" width="1" height="1" fill="#f8eedc"/>
  <rect x="1" y="3" width="9" height="1" fill="#d04040"/>
  <!-- Spot row 3 -->
  <rect x="5" y="3" width="1" height="1" fill="#f8eedc"/>
  <rect x="1" y="4" width="9" height="1" fill="#d04040"/>
  <!-- Cap base -->
  <rect x="0" y="5" width="11" height="1" fill="#b83030"/>
  <rect x="2" y="6" width="7"  height="1" fill="#902020"/>
  <!-- Stem -->
  <rect x="4" y="7" width="3" height="2" fill="#d4b880"/>
  <!-- Stem base -->
  <rect x="3" y="9" width="5" height="1" fill="#b89860"/>
</svg>
