<svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" shape-rendering="crispEdges">
  <!-- Vertical beam -->
  <rect x="4" y="0" width="1" height="9" fill="#f0c030"/>
  <!-- Horizontal beam -->
  <rect x="0" y="4" width="9" height="1" fill="#f0c030"/>
  <!-- Diagonal corners -->
  <rect x="1" y="1" width="1" height="1" fill="#f0c030"/>
  <rect x="7" y="1" width="1" height="1" fill="#f0c030"/>
  <rect x="1" y="7" width="1" height="1" fill="#f0c030"/>
  <rect x="7" y="7" width="1" height="1" fill="#f0c030"/>
  <!-- Center glow -->
  <rect x="3" y="3" width="3" height="3" fill="#f8e060"/>
  <rect x="4" y="4" width="1" height="1" fill="#ffffff"/>
</svg>
